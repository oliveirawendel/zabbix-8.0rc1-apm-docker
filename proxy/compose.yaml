services:
  zabbix-proxy:
    build:
      context: .
      args:
        ZBX_REF: ${ZBX_REF:-master}
    image: zabbix-proxy-apm:8.0
    restart: unless-stopped
    environment:
      ZBX_PROXYMODE: "0"
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: proxy-apm-01
      ZBX_APMLISTENIP: 0.0.0.0
      ZBX_APMLISTENPORT: "14317"
    ports:
      - "14317:14317"
    networks:
      - zbx
    volumes:
      - proxy_db:/var/lib/zabbix/db_data

networks:
  zbx:
    external: true
    name: zabbix8_zbx

volumes:
  proxy_db:
